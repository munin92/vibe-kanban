name: Docker Build (Remote)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'crates/remote/**'
      - 'crates/remote/Dockerfile'
      - 'packages/remote-web/**'
      - 'packages/web-core/**'
      - 'packages/ui/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-build-remote.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'crates/remote/**'
      - 'packages/remote-web/**'
      - 'shared/**'
      - '.github/workflows/docker-build-remote.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/remote

jobs:
  docker-build-remote:
    name: Build Remote Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/remote/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
            POSTHOG_API_ENDPOINT=${{ secrets.POSTHOG_API_ENDPOINT }}
            SENTRY_DSN_REMOTE=${{ secrets.SENTRY_DSN_REMOTE }}
            VITE_RELAY_API_BASE_URL=${{ secrets.VITE_RELAY_API_BASE_URL }}
